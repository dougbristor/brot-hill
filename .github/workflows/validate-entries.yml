name: validate entries
on:
  pull_request:
    paths: ['entries/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: An entry changes only entries/
        run: |
          outside=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -v '^entries/' || true)
          if [ -n "$outside" ]; then echo "This pull request changes files outside entries/:"; echo "$outside"; exit 1; fi
      - name: Validate entries (data only)
        run: node validate_entry.mjs entries/*.json
